name: Test prerelease creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          tag: v0.0.3-alpha
          name: Alpha Prerelease
          body: "This is a prerelease for CI testing."
          prerelease: "true"
          draft: "false"
          generateReleaseNotes: "false"
          token: ${{ github.token }}

      - name: Assert prerelease action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.id }}
          HTML_URL: ${{ steps.action.outputs.html_url }}
          TARBALL_URL: ${{ steps.action.outputs.tarball_url }}
          ZIPBALL_URL: ${{ steps.action.outputs.zipball_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_id: $RELEASE_ID"
          echo "html_url: $HTML_URL"
          echo "tarball_url: $TARBALL_URL"
          echo "zipball_url: $ZIPBALL_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but release id output is empty"
              exit 1
            fi
            echo "PASS: prerelease created with id=$RELEASE_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
