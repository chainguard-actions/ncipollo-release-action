name: Test release with artifact upload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test artifact file
        run: |
          echo "test artifact content" > /tmp/test-artifact.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          tag: v0.0.4-artifact-test
          name: Release with Artifact
          body: "Release with artifact for CI testing."
          draft: "true"
          artifacts: "/tmp/test-artifact.txt"
          artifactContentType: "text/plain"
          token: ${{ github.token }}

      - name: Assert artifact release action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.id }}
          ASSETS: ${{ steps.action.outputs.assets }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_id: $RELEASE_ID"
          echo "assets: $ASSETS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but release id output is empty"
              exit 1
            fi
            echo "PASS: release with artifact created with id=$RELEASE_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
