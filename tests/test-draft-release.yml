name: Test draft release creation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          tag: v0.0.2-draft-test
          name: Draft Test Release
          body: "Draft release for CI testing."
          draft: "true"
          prerelease: "false"
          token: ${{ github.token }}

      - name: Assert draft release action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RELEASE_ID: ${{ steps.action.outputs.id }}
          HTML_URL: ${{ steps.action.outputs.html_url }}
          UPLOAD_URL: ${{ steps.action.outputs.upload_url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "release_id: $RELEASE_ID"
          echo "html_url: $HTML_URL"
          echo "upload_url: $UPLOAD_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RELEASE_ID" ]; then
              echo "FAIL: action succeeded but release id output is empty"
              exit 1
            fi
            echo "PASS: draft release created with id=$RELEASE_ID"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
